version: 2.1

commands:
  install-dependencies:
    steps:
      - checkout
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "yarn.lock" }}
            - v2-dependencies-
      - run:
          name: Install yarn dependencies
          command: yarn install --frozen-lockfile
      - save_cache:
          paths:
            - node_modules
          key: v2-dependencies-{{ checksum "yarn.lock" }}

jobs:
  push_hexagon: 
     - checkout  
  test:
    parameters:
      node_version:
        type: string
    docker:
      - image: cimg/node:<<parameters.node_version>>
    working_directory: ~/repo
    steps:
      - install-dependencies
      - run:
          name: Run Tests
          command: yarn test

workflows:
  commit:
    jobs:
      - push_hexagon
      - test:
          filters:
            tags:
              only: /v[0-9]+(\.[0-9]+)*/
          matrix:
            parameters:
              node_version: ["20.20.2", "22.23.2", "24.19.0"]
  nightly:
    triggers:
      - schedule:
          cron: "0 1 * * *"
          filters:
            branches:
              only:
                - master
    jobs:
      - test:
          matrix:
            parameters:
              node_version: ["20.20.2", "22.23.2", "24.19.0"]
